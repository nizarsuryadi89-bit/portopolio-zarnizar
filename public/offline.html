<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="robots" content="noindex">
    <title>Offline — Portfolio CMS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 24px; display: grid; place-items: center; background: #f2f4f8; color: #111827; font-family: system-ui, sans-serif; }
        main { width: 100%; max-width: 420px; padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: #fff; box-shadow: 0 12px 40px #0f172a08; text-align: center; }
        .icon { margin: 0 auto 20px; width: 72px; height: 72px; border-radius: 24px; background: #eef2ff; color: #1e3a8a; display: grid; place-items: center; }
        h1 { margin: 0 0 12px; font-size: 26px; }
        p { color: #64748b; line-height: 1.65; margin: 0 0 24px; }
        button { display: block; min-height: 48px; padding: 14px; border-radius: 14px; background: #1e3a8a; color: #fff; font-weight: 600; border: 0; width: 100%; font: inherit; font-weight: 600; cursor: pointer; }
        button:focus-visible { outline: 3px solid #1e3a8a; outline-offset: 4px; }
        small { display: block; margin-top: 16px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M12 20h.01M5 12a10 10 0 0 1 3-2M14 9a10 10 0 0 1 5 3M2 8a15 15 0 0 1 3-2M9 4.4A15 15 0 0 1 22 8"/></svg>
        </div>
        <h1>Anda sedang offline</h1>
        <p>Hubungkan kembali internet untuk membuka dashboard dan mengelola konten Anda.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
        <small>Form yang gagal dikirim tidak disimpan otomatis.</small>
    </main>
</body>
</html>
